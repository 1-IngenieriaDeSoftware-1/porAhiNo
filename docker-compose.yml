# porAhiNo — stack local / demo (US-DB-08 + US-DB-11)
#
# Solo Postgres local (como antes):
#   docker compose up -d db
#
# API + frontend (BD Clever u otra vía backend/.env — no hace falta `db`):
#   docker compose up --build backend frontend
#
# Todo en Docker con Postgres local:
#   # En backend/.env usa host `db` (no localhost); ver .env.example
#   docker compose up --build
#
# Abrir Docker Desktop antes. Puertos en el host: 5432 (db), 8000 (API), 3000 (PWA).

services:
  db:
    image: postgres:16-alpine
    container_name: porAhiNo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porAhiNo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porAhiNo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-porAhiNo_db}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-porAhiNo_user} -d ${POSTGRES_DB:-porAhiNo_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: porAhiNo_api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-porAhiNo}
        NEXT_PUBLIC_APP_DESCRIPTION: "${NEXT_PUBLIC_APP_DESCRIPTION:-Consulta restricciones de Pico y Placa en Colombia}"
    container_name: porAhiNo_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
