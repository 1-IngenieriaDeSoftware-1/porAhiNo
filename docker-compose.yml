# porAhiNo — stack local / demo (US-DB-08 + US-DB-11)
#
# Solo Postgres local (como antes):
#   docker compose up -d db
#
# API + frontend (BD Clever u otra vía backend/.env — no hace falta `db`):
#   docker compose up --build backend frontend
#
# Todo en Docker con Postgres local:
#   # En backend/.env usa host `db` (no localhost); ver .env.example
#   docker compose up --build
#
# Abrir Docker Desktop antes. Puertos: 5432 (db), 8000 (API), 3000 (PWA), 8002 (Valhalla).
# Valhalla (tiles Valle de Aburrá): ver docs/VALHALLA.md

services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: porAhiNo_valhalla
    restart: unless-stopped
    ports:
      - '127.0.0.1:8002:8002'
    environment:
      # Extracto Colombia recortado al Valle de Aburrá (por defecto).
      # Para Colombia completa: usar tile_urls de Geofabrik colombia-latest.osm.pbf
      # y documentar el rebuild en docs/VALHALLA.md (mucho más disco/RAM).
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/south-america/colombia-latest.osm.pbf}
      use_tiles_ignore_pbf: 'True'
      serve_tiles: 'True'
      force_rebuild: 'False'
      # Bounding box Valle de Aburrá (lon_min,lat_min,lon_max,lat_max)
      # Recorta el PBF de Colombia al área operativa de Medellín/Aburrá.
      bounding_box: ${VALHALLA_BBOX:--75.75,6.05,-75.40,6.55}
    volumes:
      - valhalla_data:/custom_files
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8002/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  db:
    image: postgres:16-alpine
    container_name: porAhiNo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porAhiNo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porAhiNo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-porAhiNo_db}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-porAhiNo_user} -d ${POSTGRES_DB:-porAhiNo_db}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: porAhiNo_api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-porAhiNo}
        NEXT_PUBLIC_APP_DESCRIPTION: "${NEXT_PUBLIC_APP_DESCRIPTION:-Consulta restricciones de Pico y Placa en Colombia}"
    container_name: porAhiNo_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  valhalla_data:
    driver: local
