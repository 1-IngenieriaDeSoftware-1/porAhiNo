# docker-compose.yml
# Levanta PostgreSQL localmente para desarrollo.
# USO: docker-compose up -d

version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: porAhiNo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porAhiNo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porAhiNo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-porAhiNo_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-porAhiNo_user}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
