# porAhiNo — backend + frontend (PostgreSQL en la nube)
#
# Clon limpio (Docker Desktop + archivo .env en la raíz con credenciales de la BD):
#   docker compose up -d --build
#
# Frontend: http://localhost:3000
# API:      http://localhost:8000
# OpenAPI:  openapi.yaml (raíz) · http://localhost:8000/docs
#
# La URL de conexión se declara aquí; usuario y contraseña vienen solo del .env
# (nunca versionados). Ver .env.example en la raíz.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: porAhiNo_api
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      # Postgres en la nube (Clever u otro). Valores desde .env de la raíz.
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?ssl=require
      DATABASE_URL_SYNC: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
      SECRET_KEY: ${SECRET_KEY:-porahino-dev-secret-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000"]}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-porAhiNo}
        NEXT_PUBLIC_APP_DESCRIPTION: ${NEXT_PUBLIC_APP_DESCRIPTION:-Consulta restricciones de Pico y Placa en Colombia}
    container_name: porAhiNo_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      backend:
        condition: service_healthy
