# PostgreSQL 16 en Docker — solo desarrollo local.
# Cuando el producto esté casi listo se despliega a un proveedor en la nube.
# USO (desde la raíz del repo): docker compose up -d

services:
  db:
    image: postgres:16-alpine
    container_name: porAhiNo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-porAhiNo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-porAhiNo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-porAhiNo_db}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-porAhiNo_user} -d ${POSTGRES_DB:-porAhiNo_db}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
