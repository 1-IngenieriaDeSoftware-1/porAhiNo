# Alembic configuration file
# Generado para porAhiNo — migraciones de base de datos

[alembic]
script_location = alembic
prepend_sys_path = .

# URL de conexión SYNC (psycopg2) para Alembic
# Sobreescrita por env.py usando DATABASE_URL_SYNC del .env
sqlalchemy.url = postgresql://porAhiNo_user:porAhiNo_pass@localhost:5432/porAhiNo_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
